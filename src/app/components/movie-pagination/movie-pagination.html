<div class="pagination">
  <button 
    class="pagination-button" 
    (click)="previousPage()"
    [disabled]="!hasPrevious">
    &#60;
  </button>
  
  <span class="number-page">Strona {{ currentPage }} / 48 030</span>
  
  <button 
    class="pagination-button" 
    (click)="nextPage()"
    [disabled]="!hasNext">
    &#62;
  </button>
</div>
