<div class="filter-container">
  <mat-icon class="filter-icon">filter_list</mat-icon>
  <span class="filter-label">Filtruj:</span>
  <mat-form-field appearance="fill">
    <mat-label>Typ filmu</mat-label>
    <mat-select [formControl]="filmType" multiple>
      @for (filmType of filmTypeList; track filmType.value) {
        <mat-option [value]="filmType.value">{{filmType.label}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
